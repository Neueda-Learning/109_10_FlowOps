
spring.profiles.active=mysql
spring.application.name=system

# Default datasource: embedded H2 (in-memory) so the app runs out-of-the-box with no external setup.
# To use MySQL instead, run with: --spring.profiles.active=mysql (see application-mysql.properties)
spring.datasource.url=jdbc:h2:mem:salary_payment_db;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Scheduler
scheduler.scheduled-payments.cron=0 * * * * *

